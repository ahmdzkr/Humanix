; Queue worker HUMANIX (email notifikasi). Salin ke /etc/supervisor/conf.d/ lalu:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start humanix-worker:*
; Setelah deploy: php artisan queue:restart
[program:humanix-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/humanix/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/humanix
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/humanix/storage/logs/worker.log
stopwaitsecs=3600
