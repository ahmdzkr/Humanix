# Contoh konfigurasi Nginx untuk HUMANIX (sesuaikan server_name, root, dan versi PHP-FPM).
server {
    listen 80;
    listen [::]:80;
    server_name humanix.perusahaan.co.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name humanix.perusahaan.co.id;

    root /var/www/humanix/public;
    index index.php;

    # Diisi otomatis oleh certbot --nginx
    # ssl_certificate     /etc/letsencrypt/live/humanix.perusahaan.co.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/humanix.perusahaan.co.id/privkey.pem;

    charset utf-8;
    # CV 5 MB, lampiran cuti 2 MB, foto & bukti bayar: 10 MB sudah cukup longgar.
    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset hasil build Vite memakai nama ber-hash → aman di-cache lama.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Tolak file tersembunyi (.env, .git, dll.) dan file PHP lain di public/.
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }
}
